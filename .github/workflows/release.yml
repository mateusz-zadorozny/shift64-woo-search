name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4", "8.5"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs

      - name: Determine WordPress version
        id: wp-version
        run: |
          WP_VERSION="$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ | php -r '$data = json_decode(stream_get_contents(STDIN), true); echo $data["offers"][0]["version"] ?? "";')"
          if [ -z "$WP_VERSION" ]; then
            echo "Could not resolve latest WordPress version" >&2
            exit 1
          fi
          echo "version=$WP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache WordPress test suite
        id: cache-wordpress
        uses: actions/cache@v5
        with:
          path: |
            /tmp/wordpress
            /tmp/wordpress-tests-lib
          key: ${{ runner.os }}-wordpress-${{ steps.wp-version.outputs.version }}-${{ hashFiles('bin/install-wp-tests.sh') }}

      - name: Install SVN (for WP test suite)
        if: steps.cache-wordpress.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "${{ steps.wp-version.outputs.version }}" true

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
