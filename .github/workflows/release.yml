name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  changes:
    name: Determine change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      diff_base: ${{ steps.scope.outputs.diff_base }}
      diff_head: ${{ steps.scope.outputs.diff_head }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            head="$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$SHA"
          fi

          # An initial push has no meaningful parent to compare with; run the
          # full suite rather than risk classifying an incomplete diff as docs.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "diff_base=$base" >> "$GITHUB_OUTPUT"
          echo "diff_head=$head" >> "$GITHUB_OUTPUT"

          docs_only=true
          changed=false
          if ! files="$(git diff --name-only --no-renames "$base" "$head")"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            changed=true
            case "$file" in
              *.md|docs/*|.ai/*) ;;
              *) docs_only=false ;;
            esac
          done <<< "$files"

          # An empty diff should not skip validation.
          if [ "$changed" != true ]; then
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation format
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check documentation diff
        env:
          DIFF_BASE: ${{ needs.changes.outputs.diff_base }}
          DIFF_HEAD: ${{ needs.changes.outputs.diff_head }}
        run: |
          set -eu
          # Trailing whitespace, including Markdown hard breaks, is intentionally
          # disallowed in this repository's documentation format.
          git diff --check "$DIFF_BASE" "$DIFF_HEAD"

  test:
    name: Tests (PHP ${{ matrix.php-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4", "8.5"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs

      # Unit-level checks of bin/test-env.sh (PHP discovery, run-directory
      # anchoring). Seconds, no servers — unlike the clean-room launcher test,
      # which stays in the on-demand test-env workflow.
      - name: Test-env discovery unit tests
        if: matrix.php-version == '8.3'
        run: bash tests/env/test-env-discovery.sh

      - name: Determine WordPress version
        id: wp-version
        run: |
          WP_VERSION="$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ | php -r '$data = json_decode(stream_get_contents(STDIN), true); echo $data["offers"][0]["version"] ?? "";')"
          if [ -z "$WP_VERSION" ]; then
            echo "Could not resolve latest WordPress version" >&2
            exit 1
          fi
          echo "version=$WP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache WordPress test suite
        id: cache-wordpress
        uses: actions/cache@v5
        with:
          path: |
            /tmp/wordpress
            /tmp/wordpress-tests-lib
          key: ${{ runner.os }}-wordpress-${{ steps.wp-version.outputs.version }}-${{ hashFiles('bin/install-wp-tests.sh') }}

      - name: Install SVN (for WP test suite)
        if: steps.cache-wordpress.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "${{ steps.wp-version.outputs.version }}" true

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WP_ROOT: /tmp/wordpress-e2e
      E2E_PORT: "8889"
      E2E_URL: http://127.0.0.1:8889
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, mbstring, intl, redis
          coverage: none
          tools: composer:v2, wp-cli

      - name: Ensure wp server command
        # setup-php's wp-cli tool should ship wp-cli/server-command; install it
        # explicitly when it does not (flagged assumption in the e2e spec).
        run: wp package list 2>/dev/null | grep -q server-command || wp server --help >/dev/null 2>&1 || wp package install wp-cli/server-command

      - name: Install WordPress + WooCommerce
        env:
          SITE_URL: ${{ env.E2E_URL }}
        run: bash bin/e2e-install-wp.sh

      - name: Provision e2e state
        run: bash bin/e2e-provision.sh

      - name: Start wp server
        run: |
          cd "$WP_ROOT"
          PHP_CLI_SERVER_WORKERS=4 nohup wp server --host=127.0.0.1 --port="$E2E_PORT" > /tmp/wp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "$E2E_URL/"; then
              break
            fi
            [ "$i" = "30" ] && { echo "wp server never became ready" >&2; cat /tmp/wp-server.log >&2; exit 1; }
            sleep 1
          done
          BODY="$(curl -sf "$E2E_URL/wp-content/mu-plugins/shift64-woo-search/endpoint.php?q=athena&mode=autocomplete")"
          echo "$BODY" | grep -q '"success":true' || { echo "Endpoint smoke-curl failed: $BODY" >&2; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Validate block sources and generated assets
        run: |
          npm run lint:blocks
          npm run test:blocks
          npm run build:blocks
          git diff --exit-code -- build/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        env:
          BASE_URL: ${{ env.E2E_URL }}
        run: npx playwright test

      - name: Collect server log
        if: failure()
        run: cp /tmp/wp-server.log wp-server.log 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            wp-server.log
          retention-days: 7

  release:
    name: Release
    needs: [changes, docs, test, e2e]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        (
          needs.changes.outputs.docs_only == 'true' &&
          needs.docs.result == 'success'
        ) ||
        (
          needs.changes.outputs.docs_only != 'true' &&
          needs.test.result == 'success' &&
          needs.e2e.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    env:
      # Git hooks are a local development aid. This job installs Node dependencies
      # but not Composer ones, so the pre-commit hook's lint-staged rules cannot
      # find vendor/bin/phpcs and abort the version-bump commit that
      # @semantic-release/git makes. For code changes, PHPCS already ran in the
      # test job this release depends on; docs-only changes contain no PHP to
      # re-lint, so re-linting a machine-generated commit adds nothing.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
